<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSnap Studio - Pro Screenshot Editor</title>
  <link rel="stylesheet" href="studio.css">
  <script src="../capture/stitcher.js"></script>
  <script src="../capture/pdf_engine.js"></script>
</head>
<body>
  <div class="studio-root">
    <!-- Top Bar -->
    <header class="studio-topbar">
      <div class="topbar-left">
        <img src="../../icons/icon32.png" width="28" height="28" class="logo-img" alt="OmniSnap">
        <div class="capture-info">
          <div class="capture-title" id="display-title">Capture Studio</div>
          <div class="capture-meta" id="display-meta">Loading screenshot slices...</div>
        </div>
      </div>

      <!-- Center Tools -->
      <div class="tool-palette">
        <button class="tool-btn active" data-tool="select" title="Select / Move">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 0l16 12.279-6.951 1.17 4.325 8.817-3.596 1.734-4.35-8.879-5.428 5.428z"/></svg>
        </button>
        <button class="tool-btn" data-tool="crop" title="Crop Canvas">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Draw Arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Ellipse">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text Box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><text x="6" y="18" font-size="18" font-weight="bold">T</text></svg>
        </button>
        <button class="tool-btn" data-tool="badge" title="Numbered Step Badge (1, 2, 3...)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><text x="12" y="16" font-size="12" font-weight="bold" fill="currentColor" text-anchor="middle">1</text></svg>
        </button>
        <button class="tool-btn" data-tool="blur" title="Privacy Redaction (Blur / Pixelate)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </button>
      </div>

      <!-- Right Actions -->
      <div class="topbar-right">
        <!-- Zoom controls -->
        <div class="zoom-strip">
          <button id="btn-zoom-out" class="icon-btn">-</button>
          <span id="label-zoom" class="zoom-label">100%</span>
          <button id="btn-zoom-in" class="icon-btn">+</button>
          <button id="btn-zoom-fit" class="pill-btn">Fit</button>
        </div>

        <!-- 1-Click Copy -->
        <button id="btn-copy-clipboard" class="copy-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy Image
        </button>

        <!-- Export Dropdown -->
        <button id="btn-open-export" class="export-btn">
          Export ▾
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="studio-body">
      <!-- Left Tool Properties -->
      <aside class="sidebar-properties">
        <div class="prop-section">
          <div class="prop-label">COLOR</div>
          <div class="color-palette" id="palette-colors">
            <div class="swatch active" style="background:#EF4444" data-color="#EF4444"></div>
            <div class="swatch" style="background:#F59E0B" data-color="#F59E0B"></div>
            <div class="swatch" style="background:#10B981" data-color="#10B981"></div>
            <div class="swatch" style="background:#06B6D4" data-color="#06B6D4"></div>
            <div class="swatch" style="background:#4F46E5" data-color="#4F46E5"></div>
            <div class="swatch" style="background:#A855F7" data-color="#A855F7"></div>
            <div class="swatch" style="background:#EC4899" data-color="#EC4899"></div>
            <div class="swatch" style="background:#FFFFFF" data-color="#FFFFFF"></div>
          </div>
        </div>

        <div class="prop-section">
          <div class="prop-label">STROKE WIDTH</div>
          <div class="stroke-selector" id="stroke-selector">
            <button class="stroke-btn" data-width="2"><span style="height:2px"></span></button>
            <button class="stroke-btn active" data-width="4"><span style="height:4px"></span></button>
            <button class="stroke-btn" data-width="8"><span style="height:8px"></span></button>
          </div>
        </div>

        <div class="prop-section">
          <div class="prop-label">MOCKUP STUDIO</div>
          <div class="mockup-controls">
            <label class="mockup-row">
              <span>Window Frame</span>
              <select id="mockup-frame" class="mini-dropdown">
                <option value="none">None</option>
                <option value="macos-dark" selected>macOS Dark</option>
                <option value="macos-light">macOS Light</option>
                <option value="windows">Windows 11</option>
              </select>
            </label>
            <label class="mockup-row">
              <span>Padding</span>
              <select id="mockup-padding" class="mini-dropdown">
                <option value="0">0px</option>
                <option value="24">24px</option>
                <option value="48" selected>48px</option>
                <option value="80">80px</option>
              </select>
            </label>
            <label class="mockup-row">
              <span>Background</span>
              <select id="mockup-bg" class="mini-dropdown">
                <option value="transparent">Transparent</option>
                <option value="gradient-indigo" selected>Indigo Flare</option>
                <option value="gradient-sunset">Sunset</option>
                <option value="gradient-emerald">Emerald Matrix</option>
                <option value="solid-dark">Slate 900</option>
              </select>
            </label>
            <label class="mockup-row">
              <span>Drop Shadow</span>
              <input type="checkbox" id="mockup-shadow" checked>
            </label>
          </div>
        </div>
      </aside>

      <!-- Center Viewport / Canvas Container -->
      <main class="canvas-viewport" id="canvas-viewport">
        <div class="mockup-wrapper" id="mockup-wrapper">
          <div class="mockup-window" id="mockup-window">
            <div class="window-header" id="window-header">
              <div class="traffic-lights">
                <span class="light red"></span>
                <span class="light yellow"></span>
                <span class="light green"></span>
              </div>
              <div class="window-url" id="window-url-display">https://example.com</div>
            </div>
            <div class="canvas-layer-wrap">
              <canvas id="base-canvas"></canvas>
              <canvas id="annotation-canvas"></canvas>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Export Modal Dialog -->
    <div class="modal-overlay hidden" id="export-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Export &amp; Share Capture</h3>
          <button class="icon-btn" id="btn-close-modal">✕</button>
        </div>
        <div class="format-tabs">
          <button class="tab-btn active" data-fmt="png">PNG (Lossless 2x)</button>
          <button class="tab-btn" data-fmt="jpg">JPG (Compressed)</button>
          <button class="tab-btn" data-fmt="webp">WebP</button>
          <button class="tab-btn" data-fmt="pdf">PDF Multi-Page</button>
        </div>
        <div class="modal-body">
          <div class="filename-preview">
            <label>Filename:</label>
            <input type="text" id="export-filename" class="text-input" value="OmniSnap_Capture.png">
          </div>
          <div class="modal-actions">
            <button id="modal-btn-copy" class="copy-btn">Copy to Clipboard</button>
            <button id="modal-btn-download" class="export-btn">Download File</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="studio.js"></script>
</body>
</html>
