<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <img src="../../icons/icon32.png" width="32" height="32" class="logo-img" alt="GhostShot">
        <div>
          <h1 class="brand-title">GhostShot</h1>
          <span class="brand-sub">v2.0 • Ultra Screen Capture</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-options" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Capture Modes Grid -->
    <div class="section-title">CAPTURE MODES</div>
    <div class="modes-grid">
      <!-- Full Page -->
      <button class="mode-card primary" id="btn-capture-full">
        <div class="card-icon-wrap brand-gradient">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6M12 18v-6m-3 3l3 3 3-3"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Full Page Capture</div>
          <div class="card-desc">Auto-scrolls document & shadow DOM</div>
        </div>
        <span class="hotkey-badge">⌥⇧P</span>
      </button>

      <!-- Selected Region -->
      <button class="mode-card" id="btn-capture-selected">
        <div class="card-icon-wrap purple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2v4M18 2v4M2 6h4m12 0h4M2 18h4m12 0h4M6 22v-4m12 4v-4"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Selected Area</div>
          <div class="card-desc">Interactive crop region tool</div>
        </div>
        <span class="hotkey-badge">⌥⇧S</span>
      </button>

      <!-- Visible Viewport -->
      <button class="mode-card" id="btn-capture-viewport">
        <div class="card-icon-wrap blue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="card-text">
          <div class="card-title">Visible Viewport</div>
          <div class="card-desc">Instant 0ms screen snapshot</div>
        </div>
        <span class="hotkey-badge">⌥⇧V</span>
      </button>
    </div>

    <!-- Preferences Strip -->
    <div class="section-title">CAPTURE PREFERENCES</div>
    <div class="preferences-box">
      <!-- Delay -->
      <div class="pref-row">
        <span class="pref-label">Delay:</span>
        <div class="delay-pills" id="delay-selector">
          <button class="pill-btn active" data-delay="0">0s</button>
          <button class="pill-btn" data-delay="1">1s</button>
          <button class="pill-btn" data-delay="2">2s</button>
          <button class="pill-btn" data-delay="3">3s</button>
          <button class="pill-btn" data-delay="5">5s</button>
        </div>
      </div>

      <!-- Hide Fixed Headers -->
      <div class="pref-row">
        <div>
          <div class="pref-label">Hide Sticky Navbars</div>
          <div class="pref-sub">Suppresses header repeats on slices</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-hide-sticky" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <!-- Privacy Banner -->
    <footer class="popup-footer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>100% On-Device & Private • Zero Telemetry</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
