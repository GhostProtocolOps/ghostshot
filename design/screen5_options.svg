<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Page Background -->
  <rect width="800" height="600" fill="#0F172A"/>

  <!-- Container -->
  <g transform="translate(40, 30)">
    <!-- Header -->
    <g transform="translate(0, 0)">
      <rect width="36" height="36" rx="8" fill="url(#brand)"/>
      <circle cx="18" cy="18" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="18" cy="18" r="3" fill="#FFFFFF"/>
      <text x="50" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="700">GhostShot Pro Settings</text>
    </g>

    <!-- Card 1: Capture Engine -->
    <g transform="translate(0, 60)">
      <rect width="720" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="600">Capture Engine &amp; Scroll Heuristics</text>
      
      <!-- Option: Delay -->
      <g transform="translate(24, 52)">
        <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Scroll Delay between slices</text>
        <text x="0" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Higher delay allows complex SPA virtual lists (Twitter, Notion) to load completely</text>
        
        <rect x="520" y="8" width="150" height="8" rx="4" fill="#0F172A"/>
        <rect x="520" y="8" width="60" height="8" rx="4" fill="url(#brand)"/>
        <circle cx="580" cy="12" r="8" fill="#06B6D4"/>
        <text x="610" y="16" fill="#F8FAFC" font-family="monospace" font-size="12">60ms</text>
      </g>

      <!-- Option: Shadow DOM -->
      <g transform="translate(24, 102)">
        <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Recursive Shadow DOM &amp; Sticky Header Suppression</text>
        <text x="0" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Traverses custom elements to prevent floating navigation duplication</text>
        
        <!-- Toggle Active -->
        <rect x="620" y="10" width="48" height="24" rx="12" fill="#10B981"/>
        <circle cx="654" cy="22" r="9" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Card 2: Privacy & Zero Telemetry Guarantee -->
    <g transform="translate(0, 230)">
      <rect width="720" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="32" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="600">Privacy &amp; Local Processing Guarantee</text>
      <text x="24" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">GhostShot Pro operates 100% on your device. Unlike other extensions, we never send your screenshots,</text>
      <text x="24" y="72" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">browsing history, or analytics to external servers. No Google Analytics. No telemetry.</text>

      <g transform="translate(24, 90)">
        <rect width="180" height="28" rx="6" fill="#334155"/>
        <text x="90" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">Clear Local Cache (0 MB)</text>
      </g>
    </g>

    <!-- Card 3: Keyboard Shortcuts -->
    <g transform="translate(0, 380)">
      <rect width="720" height="140" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="24" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="600">Keyboard Shortcuts</text>

      <!-- Row 1 -->
      <g transform="translate(24, 52)">
        <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Capture Full Page</text>
        <rect x="580" y="2" width="80" height="24" rx="4" fill="#334155"/>
        <text x="620" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">⌥⇧P</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 90)">
        <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">Capture Selected Area</text>
        <rect x="580" y="2" width="80" height="24" rx="4" fill="#334155"/>
        <text x="620" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">⌥⇧S</text>
      </g>
    </g>
  </g>
</svg>
