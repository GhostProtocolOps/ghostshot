<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="hudGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="hudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Floating Glass Capsule -->
  <rect x="2" y="2" width="316" height="60" rx="30" fill="#0F172ACC" stroke="#334155" stroke-width="1.5" filter="url(#hudShadow)"/>

  <!-- Radial Progress Ring -->
  <g transform="translate(16, 12)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#334155" stroke-width="3.5"/>
    <!-- 65% stroke dasharray: circumference = 2 * PI * 16 = 100.5, 65% = 65.3 -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="url(#hudGrad)" stroke-width="3.5" stroke-dasharray="65.3 100.5" stroke-linecap="round" transform="rotate(-90 20 20)"/>
    <text x="20" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="700" text-anchor="middle">65%</text>
  </g>

  <!-- Text Details -->
  <g transform="translate(64, 24)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Capturing Full Page...</text>
    <text x="0" y="16" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Slice 8 of ~12 • Stitching</text>
  </g>

  <!-- Cancel Button -->
  <g transform="translate(236, 17)">
    <rect width="68" height="30" rx="15" fill="#EF444422" stroke="#EF4444" stroke-width="1"/>
    <text x="34" y="19" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">Cancel</text>
  </g>
</svg>
