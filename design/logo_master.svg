<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Master Background Gradient -->
    <linearGradient id="omniBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Shutter Blade Gradients -->
    <linearGradient id="bladeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bladeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Core Pupil Glow -->
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="omniDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow & Outer Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#omniBgGrad)" filter="url(#omniDropShadow)"/>
  
  <!-- Subtle Border Rim -->
  <rect x="32.5" y="32.5" width="447" height="447" rx="111.5" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1.5"/>

  <!-- Viewfinder Frame Reticle Corners (Screen Sniper Aesthetics) -->
  <g stroke="#E0F2FE" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M72 108 V76 H104"/>
    <!-- Top-Right -->
    <path d="M408 76 H440 V108"/>
    <!-- Bottom-Left -->
    <path d="M72 404 V436 H104"/>
    <!-- Bottom-Right -->
    <path d="M408 436 H440 V404"/>
  </g>

  <!-- Camera Lens Outer Bezel Ring -->
  <circle cx="256" cy="256" r="162" fill="#0F172A" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"/>
  <circle cx="256" cy="256" r="154" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <circle cx="256" cy="256" r="142" fill="#0F172ACC"/>

  <!-- Rotating 6-Blade Aperture Iris Mechanism -->
  <g transform="translate(256, 256)" filter="url(#coreGlow)">
    <!-- Blade 1 (0 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad1)"/>
    <!-- Blade 2 (60 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad2)" transform="rotate(60)"/>
    <!-- Blade 3 (120 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad1)" transform="rotate(120)"/>
    <!-- Blade 4 (180 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad2)" transform="rotate(180)"/>
    <!-- Blade 5 (240 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad1)" transform="rotate(240)"/>
    <!-- Blade 6 (300 deg) -->
    <path d="M0 -130 A 130 130 0 0 1 112 -65 L 42 -24 A 48 48 0 0 0 0 -48 Z" fill="url(#bladeGrad2)" transform="rotate(300)"/>

    <!-- Central Lens Pupil -->
    <circle cx="0" cy="0" r="46" fill="url(#pupilGlow)"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
    
    <!-- Optical Lens Specular Glint (Star Spark) -->
    <path d="M-8 -8 L0 -24 L8 -8 L24 0 L8 8 L0 24 L-8 8 L-24 0 Z" fill="#FFFFFF" opacity="0.9" transform="translate(18, -18) scale(0.4)"/>
  </g>

  <!-- Top Glass Sheen Reflection Arc across Squircle -->
  <path d="M34 140 C 34 82 82 34 140 34 H 372 C 430 34 478 82 478 140 C 478 180 340 310 34 260 Z" fill="url(#glassReflection)"/>
</svg>
