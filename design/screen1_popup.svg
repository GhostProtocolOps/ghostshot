<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="480" fill="url(#bgGrad)" rx="16"/>
  <rect x="0.5" y="0.5" width="359" height="479" fill="none" stroke="#334155" stroke-width="1" rx="16"/>

  <!-- Top Bar -->
  <g transform="translate(16, 16)">
    <!-- Logo -->
    <rect width="32" height="32" rx="8" fill="url(#brandGrad)"/>
    <circle cx="16" cy="16" r="7" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
    
    <!-- Title -->
    <text x="42" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="15" font-weight="700">OmniSnap Pro</text>
    <text x="42" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="500">v2.0 • Ultra Screen Capture</text>

    <!-- Header Actions -->
    <rect x="264" y="2" width="28" height="28" rx="6" fill="#334155" opacity="0.6"/>
    <!-- History Icon -->
    <path d="M278 10v6l4 2" fill="none" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="278" cy="16" r="7" fill="none" stroke="#F8FAFC" stroke-width="1.6"/>
    
    <!-- Settings Icon -->
    <rect x="298" y="2" width="28" height="28" rx="6" fill="#334155" opacity="0.6"/>
    <circle cx="312" cy="16" r="3" fill="none" stroke="#F8FAFC" stroke-width="1.6"/>
    <path d="M312 9v2m0 10v2m-7-7h2m10 0h2m-5-5l1.5 1.5m-6 6l1.5 1.5m0-9l-1.5 1.5m6 6l-1.5 1.5" stroke="#F8FAFC" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Capture Modes Grid -->
  <g transform="translate(16, 68)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" letter-spacing="0.5">CAPTURE MODES</text>

    <!-- Card 1: Full Page (Primary Glowing) -->
    <g transform="translate(0, 10)">
      <rect width="328" height="66" rx="12" fill="#1E293B" stroke="url(#brandGrad)" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="12" y="13" width="40" height="40" rx="8" fill="url(#brandGrad)" opacity="0.2"/>
      <path d="M27 23h10m-10 6h10m-10 6h6m3 3l3 3 3-3m-3-5v8" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="64" y="31" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="600">Full Page Capture</text>
      <text x="64" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Auto-scrolls document &amp; shadow DOM</text>
      
      <rect x="264" y="22" width="52" height="22" rx="4" fill="#334155"/>
      <text x="290" y="37" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">⌥⇧P</text>
    </g>

    <!-- Card 2: Selected Region -->
    <g transform="translate(0, 86)">
      <rect width="328" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="10" width="40" height="40" rx="8" fill="#334155" opacity="0.4"/>
      <path d="M26 24v-4h4m12 0h4v4m0 12v4h-4m-12 0h-4v-4" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none"/>
      
      <text x="64" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Selected Area</text>
      <text x="64" y="43" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Interactive crosshair crop tool</text>
      
      <rect x="264" y="19" width="52" height="22" rx="4" fill="#334155"/>
      <text x="290" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">⌥⇧S</text>
    </g>

    <!-- Card 3: Visible Viewport -->
    <g transform="translate(0, 154)">
      <rect width="328" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="10" width="40" height="40" rx="8" fill="#334155" opacity="0.4"/>
      <rect x="24" y="21" width="16" height="12" rx="2" stroke="#38BDF8" stroke-width="1.8" fill="none"/>
      <path d="M29 37h6m-3-4v4" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
      
      <text x="64" y="28" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600">Visible Viewport</text>
      <text x="64" y="43" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11">Instant 0ms screen snapshot</text>
      
      <rect x="264" y="19" width="52" height="22" rx="4" fill="#334155"/>
      <text x="290" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">⌥⇧V</text>
    </g>
  </g>

  <!-- Options Strip -->
  <g transform="translate(16, 305)">
    <text x="0" y="0" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" letter-spacing="0.5">CAPTURE PREFERENCES</text>
    
    <!-- Delay Buttons -->
    <g transform="translate(0, 10)">
      <text x="0" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">Delay:</text>
      <g transform="translate(56, 4)">
        <rect width="36" height="22" rx="4" fill="url(#brandGrad)"/>
        <text x="18" y="15" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="700" text-anchor="middle">0s</text>
        
        <rect x="42" width="36" height="22" rx="4" fill="#334155"/>
        <text x="60" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">1s</text>

        <rect x="84" width="36" height="22" rx="4" fill="#334155"/>
        <text x="102" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">2s</text>

        <rect x="126" width="36" height="22" rx="4" fill="#334155"/>
        <text x="144" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">3s</text>

        <rect x="168" width="36" height="22" rx="4" fill="#334155"/>
        <text x="186" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" text-anchor="middle">5s</text>
      </g>
    </g>

    <!-- Hide Sticky Nav Toggle -->
    <g transform="translate(0, 48)">
      <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">Hide Sticky Headers</text>
      <text x="0" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10">Prevents repetitive navbars on slices</text>
      
      <!-- Switch Toggle Active -->
      <rect x="290" y="4" width="38" height="20" rx="10" fill="#10B981"/>
      <circle cx="318" cy="14" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Format Selector -->
    <g transform="translate(0, 92)">
      <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500">Output Format:</text>
      <rect x="218" y="2" width="110" height="24" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="268" y="17" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" text-anchor="middle">PNG (Retina)</text>
      <path d="M314 12l4 4 4-4" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Footer Privacy Badge -->
  <g transform="translate(16, 452)">
    <path d="M12 4l6 2v5c0 4-3 7-6 8-3-1-6-4-6-8V6l6-2z" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="16" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600">100% On-Device &amp; Private • Zero Telemetry</text>
  </g>
</svg>
