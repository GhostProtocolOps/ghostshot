<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="modalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Modal Background -->
  <rect width="520" height="440" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#modalShadow)"/>

  <!-- Modal Header -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="700">Export &amp; Share Capture</text>
    <text x="0" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Choose high-resolution formats or copy directly to clipboard</text>
    <!-- Close icon -->
    <path d="M460 6l12 12m0-12l-12 12" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Format Selector Tabs -->
  <g transform="translate(24, 80)">
    <!-- PNG (Active) -->
    <rect width="110" height="56" rx="8" fill="#334155" stroke="#06B6D4" stroke-width="1.8"/>
    <text x="55" y="24" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" text-anchor="middle">PNG</text>
    <text x="55" y="42" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" text-anchor="middle">Lossless (2x)</text>

    <!-- JPG -->
    <g transform="translate(120, 0)">
      <rect width="110" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">JPG</text>
      <text x="55" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">Compact</text>
    </g>

    <!-- WebP -->
    <g transform="translate(240, 0)">
      <rect width="110" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">WebP</text>
      <text x="55" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">Modern Web</text>
    </g>

    <!-- PDF Multi-page -->
    <g transform="translate(360, 0)">
      <rect width="110" height="56" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="55" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" text-anchor="middle">PDF</text>
      <text x="55" y="42" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" text-anchor="middle">Smart Pages &amp; Links</text>
    </g>
  </g>

  <!-- Output Details & Filename -->
  <g transform="translate(24, 160)">
    <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">Filename Preview:</text>
    <rect y="26" width="472" height="40" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="16" y="51" fill="#F8FAFC" font-family="monospace" font-size="12">OmniSnap_github_com_repo_2026-11-20.png</text>

    <!-- Options Checklist -->
    <g transform="translate(0, 84)">
      <!-- Checkbox 1 -->
      <rect width="18" height="18" rx="4" fill="#4F46E5"/>
      <path d="M4 9l3 3 7-7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="28" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Preserve Full Retina 2x Pixel Density</text>

      <!-- Checkbox 2 -->
      <g transform="translate(0, 30)">
        <rect width="18" height="18" rx="4" fill="#4F46E5"/>
        <path d="M4 9l3 3 7-7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="28" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Embed Clickable Web Hyperlinks (PDF only)</text>
      </g>

      <!-- Checkbox 3 -->
      <g transform="translate(0, 60)">
        <rect width="18" height="18" rx="4" fill="#4F46E5"/>
        <path d="M4 9l3 3 7-7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="28" y="14" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12">Save to Local Capture History (IndexedDB)</text>
      </g>
    </g>
  </g>

  <!-- Modal Action Buttons -->
  <g transform="translate(24, 360)">
    <!-- Copy to Clipboard -->
    <rect width="220" height="48" rx="10" fill="#10B981"/>
    <path d="M42 24l5 5 10-10" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <text x="120" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" text-anchor="middle">Copy to Clipboard</text>

    <!-- Download -->
    <rect x="240" width="232" height="48" rx="10" fill="url(#brandGrad)"/>
    <path d="M320 18v12m-5-4l5 5 5-5m-10 9h20" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="365" y="29" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="700" text-anchor="middle">Download PNG</text>
  </g>
</svg>
